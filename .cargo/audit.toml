[advisories]
ignore = [
    # paste: unmaintained (archived), not a vulnerability. Transitive,
    # compile-time-only dep via tokenizers -> macro_rules_attribute -> paste.
    # No source uses it directly and there is no upstream fix to take.
    "RUSTSEC-2024-0436",
    # chrono: unmaintained, not a vulnerability. Besides sqlx-json's sqlx
    # `chrono` feature, rmcp depends on chrono unconditionally (and enables
    # schemars/chrono04), and russh-util pulls it into Cargo.lock for wasm32.
    # Drop once rmcp makes chrono optional (modelcontextprotocol/rust-sdk#1469)
    # and sqlx-json no longer uses it.
    "RUSTSEC-2026-0543",
]
