{{- $token := ternary "" .Values.auth.token .Values.auth.dangerouslyAllowUnauthenticated }}
{{- if and (not .Values.existingSecret.name) (or $token .Values.database.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbmcp.fullname" . }}
  labels:
    {{- include "dbmcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with $token }}
  {{ $.Values.existingSecret.authTokenKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.database.password }}
  {{ $.Values.existingSecret.passwordKey }}: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
