apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dbmcp.fullname" . }}-test-connection
  labels:
    {{- include "dbmcp.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget", "-q", "-O", "-", "http://{{ include "dbmcp.fullname" . }}:{{ .Values.service.port }}/readyz"]
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  restartPolicy: Never
