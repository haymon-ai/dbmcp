{{- if and (not .Values.auth.dangerouslyAllowUnauthenticated) (not .Values.existingSecret.name) (not .Values.auth.token) }}
{{- fail "dbmcp needs a bearer token: set auth.token, existingSecret.name, or auth.dangerouslyAllowUnauthenticated=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbmcp.fullname" . }}
  labels:
    {{- include "dbmcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dbmcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dbmcp.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dbmcp.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dbmcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DBMCP_CONFIG_FILE
              value: /etc/dbmcp/dbmcp.yaml
            - name: DBMCP_TRANSPORT
              value: http
            - name: DBMCP_HTTP_HOST
              value: 0.0.0.0
            - name: DBMCP_HTTP_PORT
              value: {{ .Values.service.port | quote }}
            - name: DBMCP_HTTP_ALLOWED_HOSTS
              value: {{ include "dbmcp.allowedHosts" . | quote }}
            {{- if .Values.auth.dangerouslyAllowUnauthenticated }}
            - name: DBMCP_HTTP_DANGEROUSLY_ALLOW_UNAUTHENTICATED
              value: "true"
            {{- else }}
            - name: DBMCP_HTTP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "dbmcp.secretName" . }}
                  key: {{ .Values.existingSecret.authTokenKey }}
            {{- end }}
            {{- if or .Values.existingSecret.name .Values.database.password }}
            - name: DBMCP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dbmcp.secretName" . }}
                  key: {{ .Values.existingSecret.passwordKey }}
                  optional: {{ not (empty .Values.existingSecret.name) }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/dbmcp
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dbmcp.fullname" . }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
