    { path = "serde_json::Map::remove", reason = "swap_remove under preserve_order; use shift_remove" },
    { path = "serde_json::Map::remove_entry", reason = "swap_remove under preserve_order; use shift_remove_entry" },
    { path = "serde_json::map::OccupiedEntry::remove", reason = "swap_remove under preserve_order; use shift_remove" },
    { path = "serde_json::map::OccupiedEntry::remove_entry", reason = "swap_remove under preserve_order; use shift_remove_entry" },
]
