[test-groups]
# The database suites share one seeded database, so they run one at a time.
db = { max-threads = 1 }

[profile.default]
# The database suites need ./tests/run.sh or a CI service; select them with
# --ignore-default-filter -E 'binary_id(...)'.
default-filter = 'not (binary_id(dbmcp::functional_*) | binary_id(dbmcp::approval_*))'

[[profile.default.overrides]]
filter = 'binary_id(dbmcp::functional_*) | binary_id(dbmcp::approval_*) | ((package(dbmcp-mysql) | package(dbmcp-postgres)) & kind(lib) & test(/^policy::tests::db::/))'
test-group = 'db'

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 4 }
