name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: dbmcp
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: dbmcp
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: dbmcp
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            artifact: dbmcp.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../dbmcp-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact }} -DestinationPath dbmcp-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: dbmcp-${{ matrix.target }}
          path: dbmcp-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@v4.2.0
        id: changelog
        with:
          command: changelog
          args: --at ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # A Sigstore or attestation API outage must not block the release and the publish jobs after it.
      - uses: actions/attest@v4
        continue-on-error: true
        with:
          subject-path: artifacts/*

      - name: Generate checksums
        working-directory: artifacts
        run: |
          # One `<hash>  <name>` file per asset: Scoop's autoupdate reads `$url.sha256`, and `sha256sum -c` checks it.
          for f in *; do sha256sum "$f" > "$f.sha256"; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.stdout }}
          files: artifacts/*

  ghcr-io:
    name: Publish image and Helm chart to ghcr.io
    needs: [release]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      CHARTS: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v7

      - uses: sigstore/cosign-installer@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            io.modelcontextprotocol.server.name=ai.haymon/dbmcp
            org.opencontainers.image.title=dbmcp
            org.opencontainers.image.description=Database MCP server for MySQL, MariaDB, PostgreSQL & SQLite
            org.opencontainers.image.licenses=MIT

      - uses: actions/download-artifact@v8
        with:
          pattern: dbmcp-*-unknown-linux-gnu
          path: artifacts
          merge-multiple: true

      # The release binaries replace the Dockerfile's build stage.
      - name: Stage binaries
        run: |
          mkdir -p dist/out/amd64 dist/out/arm64
          tar xzf artifacts/dbmcp-x86_64-unknown-linux-gnu.tar.gz -C dist/out/amd64
          tar xzf artifacts/dbmcp-aarch64-unknown-linux-gnu.tar.gz -C dist/out/arm64
          test -x dist/out/amd64/dbmcp && test -x dist/out/arm64/dbmcp

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: build=dist
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # `--recursive` also signs each platform manifest, which a pull pinned to one platform resolves to.
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      # The chart publishes after the image, so it never points at a missing image tag.
      - uses: azure/setup-helm@v4

      - uses: oras-project/setup-oras@v1

      - id: chart
        name: Package and push chart
        run: |
          helm package charts/dbmcp
          helm push "dbmcp-${GITHUB_REF_NAME#v}.tgz" "oci://${CHARTS}"
          digest=$(oras resolve "${CHARTS}/dbmcp:${GITHUB_REF_NAME#v}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.CHARTS }}/dbmcp
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Sign chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${CHARTS}/dbmcp@${DIGEST}"

      - name: Push Artifact Hub metadata
        run: |
          oras push "${CHARTS}/dbmcp:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  npmjs-org:
    name: Publish to npmjs.org
    needs: [release]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Stage binaries and versions
        run: |
          mkdir -p npm/dbmcp-{linux-x64,linux-arm64,darwin-arm64,win32-x64}/bin
          tar xzf artifacts/dbmcp-x86_64-unknown-linux-gnu.tar.gz -C npm/dbmcp-linux-x64/bin
          tar xzf artifacts/dbmcp-aarch64-unknown-linux-gnu.tar.gz -C npm/dbmcp-linux-arm64/bin
          tar xzf artifacts/dbmcp-aarch64-apple-darwin.tar.gz -C npm/dbmcp-darwin-arm64/bin
          unzip -q artifacts/dbmcp-x86_64-pc-windows-msvc.zip -d npm/dbmcp-win32-x64/bin
          sed -i "s/\"0\.0\.0\"/\"${GITHUB_REF_NAME#v}\"/" npm/*/package.json

      - name: Publish packages
        run: |
          # Platform packages first; skip versions already on npm so the job can be re-run.
          # `./` makes npm read a local directory, not a GitHub `owner/repo` shorthand.
          for name in dbmcp-linux-x64 dbmcp-linux-arm64 dbmcp-darwin-arm64 dbmcp-win32-x64 dbmcp; do
            npm view "@haymon-ai/$name@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1 || npm publish "./npm/$name" --access public
          done

  registry-modelcontextprotocol-io:
    name: Publish to registry.modelcontextprotocol.io
    needs: [ghcr-io, npmjs-org, crates-io]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login dns --domain=haymon.ai --private-key=${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Wait for npm package
        timeout-minutes: 10
        run: |
          # The registry rejects the npm package until npm serves the new version, a few minutes after publish.
          # `--prefer-online` skips npm's cache, which keeps the package document for 5 minutes.
          until npm view "@haymon-ai/dbmcp@${GITHUB_REF_NAME#v}" version --prefer-online > /dev/null 2>&1; do sleep 15; done

      - name: Wait for crates.io README
        timeout-minutes: 10
        run: |
          # The registry checks the README crates.io renders after publish, which can lag the publish by minutes.
          # The readme endpoint redirects to the rendered HTML on static.crates.io; crates.io asks for a descriptive User-Agent.
          until curl -fsSL -A "dbmcp-release (https://github.com/haymon-ai/dbmcp)" "https://crates.io/api/v1/crates/dbmcp/${GITHUB_REF_NAME#v}/readme" | grep -q 'mcp-name: ai.haymon/dbmcp'; do sleep 15; done

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  crates-io:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish workspace
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
