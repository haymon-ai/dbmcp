name: Docker

# The release and helm images replace the Dockerfile's source build stage, so build it
# here the way `docker build .` and the Docker MCP Catalog do, whenever its inputs change.
on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - crates/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/**
      - crates/**
      - .github/workflows/docker.yml

# A newer push to a pull request cancels its stale run; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build from source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check Rust image matches rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          grep -q "^FROM rust:${channel}-" Dockerfile \
            || { echo "::error file=Dockerfile::rust image tag must match rust-toolchain.toml channel ${channel}"; exit 1; }

      - name: Build image
        run: docker build -t dbmcp:src .

      - name: Run image
        run: docker run --rm dbmcp:src --version
