name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: 0.9.152
  NEXTEST_PROFILE: ci
  INSTA_WORKSPACE_ROOT: ${{ github.workspace }}

jobs:
  commits:
    name: Commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
          args: --from-latest-tag

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  taplo:
    name: Taplo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: uncenter/setup-taplo@v2
        with:
          version: "0.9.3"
      - run: taplo fmt --check --diff

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests -- -D warnings

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  doctests:
    name: Doc Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --doc --workspace

  archive:
    name: Build Nextest Archive
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - run: cargo nextest archive --workspace --tests --archive-file "$RUNNER_TEMP/nextest.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  unit-linux:
    name: Unit Tests (ubuntu-24.04)
    needs: archive
    runs-on: ubuntu-24.04
    env:
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst"

  unit-windows:
    name: Unit Tests (windows-2025)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - run: cargo nextest run --workspace

  unit-macos:
    name: Unit Tests (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A restored ~/.cargo/bin breaks cargo subcommands on macOS runners (Swatinem/rust-cache#341).
          cache-bin: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - run: cargo nextest run --workspace

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: helm/chart-testing-action@v2

      - name: Lint
        run: ct lint --config ct.yaml --all

      - uses: helm/kind-action@v1

      # Postgres starts in the background while the image builds.
      - name: Start Postgres
        run: |
          kubectl create deployment postgres --image=postgres:19-alpine --port=5432
          kubectl set env deployment/postgres POSTGRES_PASSWORD=postgres
          kubectl expose deployment postgres --port=5432

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The chart's probes need /healthz and /readyz, which a published image may predate,
      # so test against an image of this commit, built from the release Dockerfile with
      # its source build stage replaced by the local binary.
      # A debug build is enough for an install test and skips the release profile's LTO.
      - name: Build image
        run: |
          cargo build
          mkdir -p image/out/amd64 && cp target/debug/dbmcp image/out/amd64/
          docker build -t dbmcp:ci --build-context build=image .

      - name: Load image into kind
        run: kind load docker-image dbmcp:ci --name chart-testing

      - name: Install and test
        run: |
          kubectl rollout status deployment/postgres --timeout=120s
          ct install --config ct.yaml --all \
            --helm-extra-set-args "--set image.repository=dbmcp --set image.tag=ci --set image.pullPolicy=Never"

  mariadb:
    name: MariaDB ${{ matrix.version }}
    runs-on: ubuntu-24.04
    needs: archive
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Quoted: unquoted YAML reads 26.10 as 26.1 and 13.0 as 13.
        version: ["10.11", "11.4", "11.8", "12.3", "13.0"]
    env:
      RUSTUP_AUTO_INSTALL: "0"
    services:
      mariadb:
        image: mariadb:${{ matrix.version }}
        env:
          MARIADB_ROOT_HOST: '%'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      sshd:
        image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: dbmcp
          USER_PASSWORD: dbmcp
          DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z 127.0.0.1 2222"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - name: Seed database
        run: docker exec -i ${{ job.services.mariadb.id }} mariadb -u root < tests/seed/mysql.sql
      - name: Approval tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::approval_mysql)'
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Functional tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::functional_mysql)'
        env:
          DBMCP_DB_BACKEND: mariadb
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Policy tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" -E 'package(dbmcp-mysql) & kind(lib)' --run-ignored only
        env:
          DBMCP_DB_BACKEND: mariadb
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Authorize SSH test keys
        run: docker exec -i ${{ job.services.sshd.id }} sh -c 'cat >> /config/.ssh/authorized_keys' < tests/ssh/authorized_keys
      - name: SSH tunnel tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::functional_ssh)'
        env:
          DBMCP_DB_BACKEND: mysql
          DBMCP_DB_HOST: mariadb
          DBMCP_DB_PORT: 3306
          DBMCP_SSH_HOST: 127.0.0.1
          DBMCP_SSH_PORT: 2222
          DBMCP_SSH_USER: dbmcp
          DBMCP_SSH_PASSWORD: dbmcp
          DBMCP_SSH_STRICT_HOST_KEY_CHECKING: "no"
          SSHD_CONTAINER: ${{ job.services.sshd.id }}

  mysql:
    name: MySQL ${{ matrix.version }}
    runs-on: ubuntu-24.04
    needs: archive
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Quoted: unquoted YAML reads 26.10 as 26.1 and 13.0 as 13.
        version: ["8.4", "9.7", "26.10"]
    env:
      RUSTUP_AUTO_INSTALL: "0"
    services:
      mysql:
        image: mysql:${{ matrix.version }}
        env:
          MYSQL_ROOT_HOST: '%'
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -u root --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      sshd:
        image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: dbmcp
          USER_PASSWORD: dbmcp
          DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z 127.0.0.1 2222"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - name: Seed database
        run: docker exec -i ${{ job.services.mysql.id }} mysql -u root < tests/seed/mysql.sql
      - name: Approval tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::approval_mysql)'
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Functional tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::functional_mysql)'
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Policy tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" -E 'package(dbmcp-mysql) & kind(lib)' --run-ignored only
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Authorize SSH test keys
        run: docker exec -i ${{ job.services.sshd.id }} sh -c 'cat >> /config/.ssh/authorized_keys' < tests/ssh/authorized_keys
      - name: Export MySQL CA certificate
        run: docker exec ${{ job.services.mysql.id }} cat /var/lib/mysql/ca.pem > "$RUNNER_TEMP/mysql_ca.pem"
      - name: SSH tunnel tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::functional_ssh)'
        env:
          TLS_TEST_CA: ${{ runner.temp }}/mysql_ca.pem
          DBMCP_DB_BACKEND: mysql
          DBMCP_DB_HOST: mysql
          DBMCP_DB_PORT: 3306
          DBMCP_SSH_HOST: 127.0.0.1
          DBMCP_SSH_PORT: 2222
          DBMCP_SSH_USER: dbmcp
          DBMCP_SSH_PASSWORD: dbmcp
          DBMCP_SSH_STRICT_HOST_KEY_CHECKING: "no"
          SSHD_CONTAINER: ${{ job.services.sshd.id }}

  postgres:
    name: PostgreSQL ${{ matrix.version }}
    runs-on: ubuntu-24.04
    needs: archive
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["15", "16", "17", "18", "19"]
    env:
      RUSTUP_AUTO_INSTALL: "0"
    services:
      postgres:
        image: postgres:${{ matrix.version }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=15
      sshd:
        image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: dbmcp
          USER_PASSWORD: dbmcp
          DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z 127.0.0.1 2222"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - name: Seed database
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres < tests/seed/postgres.sql
      - name: Approval tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::approval_postgres)'
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 5432
      - name: Functional tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::functional_postgres)'
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 5432
      - name: Policy tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" -E 'package(dbmcp-postgres) & kind(lib)' --run-ignored only
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 5432
      - name: Authorize SSH test keys
        run: docker exec -i ${{ job.services.sshd.id }} sh -c 'cat >> /config/.ssh/authorized_keys' < tests/ssh/authorized_keys
      - name: SSH tunnel tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::functional_ssh)'
        env:
          DBMCP_DB_BACKEND: postgres
          DBMCP_DB_HOST: postgres
          DBMCP_DB_PORT: 5432
          DBMCP_SSH_HOST: 127.0.0.1
          DBMCP_SSH_PORT: 2222
          DBMCP_SSH_USER: dbmcp
          DBMCP_SSH_PASSWORD: dbmcp
          DBMCP_SSH_STRICT_HOST_KEY_CHECKING: "no"
          SSHD_CONTAINER: ${{ job.services.sshd.id }}

  sqlite:
    name: SQLite
    runs-on: ubuntu-24.04
    needs: archive
    timeout-minutes: 15
    env:
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - name: Seed database
        run: sqlite3 /tmp/app.db < tests/seed/sqlite.sql
      - name: Approval tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::approval_sqlite)'
        env:
          DB_PATH: /tmp/app.db
      - name: Functional tests
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --ignore-default-filter -E 'binary_id(dbmcp::functional_sqlite)'
        env:
          DB_PATH: /tmp/app.db
