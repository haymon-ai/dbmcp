name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  commits:
    name: Commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@v4.2.0
        with:
          command: check
          args: --from-latest-tag

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  taplo:
    name: Taplo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: uncenter/setup-taplo@v2
        with:
          version: "0.9.3"
      - run: taplo fmt --check --diff

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests -- -D warnings

  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --bins

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: helm/chart-testing-action@v2

      - name: Lint
        run: ct lint --config ct.yaml --all

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The chart's probes need /healthz and /readyz, which a published image may predate,
      # so test against an image of this commit, on the release image's base.
      # A debug build is enough for an install test and skips the release profile's LTO.
      - name: Build image
        run: |
          cargo build
          mkdir image && cp target/debug/dbmcp image/
          docker build -t dbmcp:ci -f - image <<'EOF'
          FROM gcr.io/distroless/cc-debian12
          COPY dbmcp /dbmcp
          USER nonroot
          ENTRYPOINT ["/dbmcp"]
          EOF

      - uses: helm/kind-action@v1

      - name: Load image into kind
        run: kind load docker-image dbmcp:ci --name chart-testing

      - name: Start Postgres
        run: |
          kubectl create deployment postgres --image=postgres:18-alpine --port=5432
          kubectl set env deployment/postgres POSTGRES_PASSWORD=postgres
          kubectl expose deployment postgres --port=5432
          kubectl rollout status deployment/postgres --timeout=120s

      - name: Install and test
        run: >-
          ct install --config ct.yaml --all
          --helm-extra-set-args "--set image.repository=dbmcp --set image.tag=ci --set image.pullPolicy=Never"

  mariadb:
    name: MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:12
        env:
          MARIADB_ROOT_HOST: '%'
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      sshd:
        image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: dbmcp
          USER_PASSWORD: dbmcp
          DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z 127.0.0.1 2222"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Seed database
        run: docker exec -i ${{ job.services.mariadb.id }} mariadb -u root < tests/seed/mysql.sql
      - name: Approval tests
        run: cargo test --test approval_mysql -- --test-threads=1
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Functional tests
        run: cargo test --test functional_mysql -- --test-threads=1
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Authorize SSH test keys
        run: docker exec -i ${{ job.services.sshd.id }} sh -c 'cat >> /config/.ssh/authorized_keys' < tests/ssh/authorized_keys
      - name: SSH tunnel tests
        run: cargo test --test functional_ssh -- --test-threads=1
        env:
          DBMCP_DB_BACKEND: mysql
          DBMCP_DB_HOST: mariadb
          DBMCP_DB_PORT: 3306
          DBMCP_SSH_HOST: 127.0.0.1
          DBMCP_SSH_PORT: 2222
          DBMCP_SSH_USER: dbmcp
          DBMCP_SSH_PASSWORD: dbmcp
          DBMCP_SSH_STRICT_HOST_KEY_CHECKING: "no"
          SSHD_CONTAINER: ${{ job.services.sshd.id }}

  mysql:
    name: MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_HOST: '%'
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -u root --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      sshd:
        image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: dbmcp
          USER_PASSWORD: dbmcp
          DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z 127.0.0.1 2222"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Seed database
        run: docker exec -i ${{ job.services.mysql.id }} mysql -u root < tests/seed/mysql.sql
      - name: Approval tests
        run: cargo test --test approval_mysql -- --test-threads=1
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Functional tests
        run: cargo test --test functional_mysql -- --test-threads=1
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 3306
      - name: Authorize SSH test keys
        run: docker exec -i ${{ job.services.sshd.id }} sh -c 'cat >> /config/.ssh/authorized_keys' < tests/ssh/authorized_keys
      - name: Export MySQL CA certificate
        run: docker exec ${{ job.services.mysql.id }} cat /var/lib/mysql/ca.pem > "$RUNNER_TEMP/mysql_ca.pem"
      - name: SSH tunnel tests
        run: cargo test --test functional_ssh -- --test-threads=1
        env:
          TLS_TEST_CA: ${{ runner.temp }}/mysql_ca.pem
          DBMCP_DB_BACKEND: mysql
          DBMCP_DB_HOST: mysql
          DBMCP_DB_PORT: 3306
          DBMCP_SSH_HOST: 127.0.0.1
          DBMCP_SSH_PORT: 2222
          DBMCP_SSH_USER: dbmcp
          DBMCP_SSH_PASSWORD: dbmcp
          DBMCP_SSH_STRICT_HOST_KEY_CHECKING: "no"
          SSHD_CONTAINER: ${{ job.services.sshd.id }}

  postgres:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=15
      sshd:
        image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: dbmcp
          USER_PASSWORD: dbmcp
          DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z 127.0.0.1 2222"
          --health-interval=2s
          --health-timeout=2s
          --health-retries=60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Seed database
        run: docker exec -i ${{ job.services.postgres.id }} psql -U postgres < tests/seed/postgres.sql
      - name: Approval tests
        run: cargo test --test approval_postgres -- --test-threads=1
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 5432
      - name: Functional tests
        run: cargo test --test functional_postgres -- --test-threads=1
        env:
          DBMCP_DB_HOST: 127.0.0.1
          DBMCP_DB_PORT: 5432
      - name: Authorize SSH test keys
        run: docker exec -i ${{ job.services.sshd.id }} sh -c 'cat >> /config/.ssh/authorized_keys' < tests/ssh/authorized_keys
      - name: SSH tunnel tests
        run: cargo test --test functional_ssh -- --test-threads=1
        env:
          DBMCP_DB_BACKEND: postgres
          DBMCP_DB_HOST: postgres
          DBMCP_DB_PORT: 5432
          DBMCP_SSH_HOST: 127.0.0.1
          DBMCP_SSH_PORT: 2222
          DBMCP_SSH_USER: dbmcp
          DBMCP_SSH_PASSWORD: dbmcp
          DBMCP_SSH_STRICT_HOST_KEY_CHECKING: "no"
          SSHD_CONTAINER: ${{ job.services.sshd.id }}

  sqlite:
    name: SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Seed database
        run: sqlite3 /tmp/app.db < tests/seed/sqlite.sql
      - name: Approval tests
        run: cargo test --test approval_sqlite -- --test-threads=1
        env:
          DB_PATH: /tmp/app.db
      - name: Functional tests
        run: cargo test --test functional_sqlite -- --test-threads=1
        env:
          DB_PATH: /tmp/app.db
