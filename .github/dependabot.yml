version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      all-cargo-deps:
        patterns:
          - "*"
    ignore:
      # ort is exact-pinned: rc.11+ breaks the aarch64-apple-darwin release
      # (fat LTO) link and ships no x86_64-apple-darwin prebuilt.
      - dependency-name: ort

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-actions-deps:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      all-docker-deps:
        patterns:
          - "*"
    ignore:
      # rust-toolchain.toml picks the Rust version; take only digest updates.
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
