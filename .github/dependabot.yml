version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      all-cargo-deps:
        patterns:
          - "*"
    ignore:
      # ort is exact-pinned: every bump needs the macOS fat-LTO link check in
      # the comment above `ort` in Cargo.toml.
      - dependency-name: ort

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-actions-deps:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      all-docker-deps:
        patterns:
          - "*"
    ignore:
      # rust-toolchain.toml picks the Rust version; take only digest updates.
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
