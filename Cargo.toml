[package]
name = "dbmcp"
version.workspace = true
edition.workspace = true
description.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["mcp", "database", "mysql", "postgresql", "sqlite"]
categories = ["database", "command-line-utilities"]

[workspace]
members = [".", "crates/*"]

[workspace.package]
version = "0.15.0"
edition = "2024"
description = "A single-binary MCP server for MySQL, MariaDB, PostgreSQL, and SQLite"
homepage = "https://dbmcp.haymon.ai"
license = "MIT"
repository = "https://github.com/haymon-ai/dbmcp"

[workspace.dependencies]
# Internal workspace crates
dbmcp-cli = { path = "crates/cli", version = "0.15.0" }
dbmcp-config = { path = "crates/config", version = "0.15.0" }
dbmcp-mysql = { path = "crates/mysql", version = "0.15.0" }
dbmcp-pii = { path = "crates/pii", version = "0.15.0" }
dbmcp-postgres = { path = "crates/postgres", version = "0.15.0" }
dbmcp-server = { path = "crates/server", version = "0.15.0" }
dbmcp-sql = { path = "crates/sql", version = "0.15.0" }
dbmcp-sql-lineage = { path = "crates/sql-lineage", version = "0.15.0" }
dbmcp-sqlite = { path = "crates/sqlite", version = "0.15.0" }
dbmcp-ssh = { path = "crates/ssh", version = "0.15.0" }
sqlx-json = { path = "crates/sqlx-json", version = "0.15.0" }

# External dependencies
axum = "0.8"
base64 = "0.23"
bech32 = "0.12"
bigdecimal = "0.4"
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4", features = ["derive", "env"] }
fancy-regex = "0.19"
http = "1"
indexmap = { version = "2", features = ["serde"] }
mimalloc = "0.1"
moka = { version = "0.12", features = ["future"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
    "download-binaries",
    "std",
] }
ring = "0.17"
rmcp = { version = "3.5", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
schemars = { version = "1.2", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls"] }
subtle = "2.6"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Dev/test dependencies
criterion = { version = "0.8", features = ["html_reports"] }
insta = { version = "1", features = ["json", "redactions"] }
tempfile = "3"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
struct_excessive_bools = "allow"
module_name_repetitions = "allow"

[lints]
workspace = true

[dependencies]
dbmcp-cli = { workspace = true }
mimalloc = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
dbmcp-config = { workspace = true }
dbmcp-mysql = { workspace = true }
dbmcp-postgres = { workspace = true }
dbmcp-server = { workspace = true }
dbmcp-sqlite = { workspace = true }
indexmap = { workspace = true }
insta = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[[test]]
name = "functional_mysql"
path = "tests/functional/mysql.rs"

[[test]]
name = "functional_postgres"
path = "tests/functional/postgres.rs"

[[test]]
name = "functional_sqlite"
path = "tests/functional/sqlite.rs"

[[test]]
name = "functional_ssh"
path = "tests/functional/ssh.rs"

[[test]]
name = "approval_mysql"
path = "tests/approval/mysql.rs"

[[test]]
name = "approval_postgres"
path = "tests/approval/postgres.rs"

[[test]]
name = "approval_sqlite"
path = "tests/approval/sqlite.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
