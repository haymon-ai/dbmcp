x-mariadb: &mariadb
    volumes:
        - "./seed/mysql.sql:/docker-entrypoint-initdb.d/setup.sql:z"
    ports:
        - "127.0.0.1::3306"
    environment:
        MARIADB_ROOT_HOST: '%'
        MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"

x-mysql: &mysql
    volumes:
        - "./seed/mysql.sql:/docker-entrypoint-initdb.d/setup.sql:z"
    ports:
        - "127.0.0.1::3306"
    environment:
        MYSQL_ROOT_HOST: '%'
        MYSQL_ALLOW_EMPTY_PASSWORD: "yes"

x-postgres: &postgres
    volumes:
        - "./seed/postgres.sql:/docker-entrypoint-initdb.d/setup.sql:z"
    ports:
        - "127.0.0.1::5432"
    environment:
        POSTGRES_USER: postgres
        POSTGRES_HOST_AUTH_METHOD: trust

services:
    mariadb_10_11:
        <<: *mariadb
        image: mariadb:10.11

    mariadb_11_4:
        <<: *mariadb
        image: mariadb:11.4

    mariadb_11_8:
        <<: *mariadb
        image: mariadb:11.8

    mariadb_12_3:
        <<: *mariadb
        image: mariadb:12.3

    mariadb_13_0:
        <<: *mariadb
        image: mariadb:13.0

    mysql_8_4:
        <<: *mysql
        image: mysql:8.4

    mysql_9_7:
        <<: *mysql
        image: mysql:9.7

    mysql_26_10:
        <<: *mysql
        image: mysql:26.10

    postgres_15:
        <<: *postgres
        image: postgres:15-alpine

    postgres_16:
        <<: *postgres
        image: postgres:16-alpine

    postgres_17:
        <<: *postgres
        image: postgres:17-alpine

    postgres_18:
        <<: *postgres
        image: postgres:18-alpine

    postgres_19:
        <<: *postgres
        image: postgres:19-alpine

    # SSH bastion for functional_ssh. Tests reach databases by service name,
    # which only resolves inside the compose network, i.e. through sshd.
    sshd:
        image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
        ports:
            - "127.0.0.1::2222"
        environment:
            PASSWORD_ACCESS: "true"
            USER_NAME: dbmcp
            USER_PASSWORD: dbmcp
            PUBLIC_KEY_FILE: /keys/authorized_keys
            DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel
        volumes:
            - "./ssh/authorized_keys:/keys/authorized_keys:ro,z"
        # sshd starts only after the ssh-tunnel mod is installed on first boot.
        healthcheck:
            test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]
            interval: 1s
            timeout: 2s
            retries: 120

    sqlite:
        image: alpine/sqlite
        user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
        entrypoint: sh
        command: -c "rm -f /data/database.db && sqlite3 /data/database.db < /seed/setup.sql"
        volumes:
            - "./seed/sqlite.sql:/seed/setup.sql:ro,z"
            - ".:/data:z"
